<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="repo-shelf-token" content="__RS_TOKEN__">
  <link rel="icon" type="image/png" href="/icon.png">
  <title>Repo Shelf</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="mode-compact">
    <!-- Omnibox row -->
    <div class="omnibox-row">
      <svg class="omni-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M6.5 1a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm4.53 7.47 3.44 3.44-1.06 1.06-3.44-3.44z"/></svg>
      <input id="omnibox" class="omnibox" type="text" autocomplete="off" spellcheck="false">
      <button id="btn-filter" class="icon-btn" type="button" title="Filters" aria-label="Filters">
        <svg viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M1 2.5h14l-5.5 6.4v4.6L6.5 14.5V8.9z"/></svg>
      </button>
      <button id="btn-import" class="icon-btn" type="button" title="Import">
        <svg viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M8 1.5 12.5 6H9.5v4h-3V6H3.5zM2 12.5h12v2H2z"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" title="Settings">
        <svg viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M8 5.3A2.7 2.7 0 1 0 8 10.7 2.7 2.7 0 0 0 8 5.3m6.6 4.1 1.3 1a.4.4 0 0 1 .1.5l-1.2 2.1a.4.4 0 0 1-.5.2l-1.5-.6a5 5 0 0 1-.9.5l-.3 1.6a.4.4 0 0 1-.4.3H8.8a.4.4 0 0 1-.4-.3l-.3-1.6a5 5 0 0 1-.9-.5l-1.5.6a.4.4 0 0 1-.5-.2l-1.2-2.1a.4.4 0 0 1 .1-.5l1.3-1a4.8 4.8 0 0 1 0-1L4.1 7.4a.4.4 0 0 1-.1-.5l1.2-2.1a.4.4 0 0 1 .5-.2l1.5.6a5 5 0 0 1 .9-.5l.3-1.6a.4.4 0 0 1 .4-.3h2.4a.4.4 0 0 1 .4.3l.3 1.6c.3.1.6.3.9.5l1.5-.6a.4.4 0 0 1 .5.2l1.2 2.1a.4.4 0 0 1-.1.5l-1.3 1c.1.3.1.6 0 1z"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" type="button" title="Theme" aria-label="Toggle theme">
        <svg id="theme-icon-dark" viewBox="0 0 16 16" width="15" height="15"><path fill="currentColor" d="M8 11.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM8 1.6a.6.6 0 0 0 .6-.6V.6a.6.6 0 0 0-1.2 0v.4a.6.6 0 0 0 .6.6zm0 12.8a.6.6 0 0 0-.6.6v.4a.6.6 0 0 0 1.2 0V15a.6.6 0 0 0-.6-.6zM1.6 8a.6.6 0 0 0-.6.6v0a.6.6 0 0 0 .6.6h.4a.6.6 0 0 0 .6-.6.6.6 0 0 0-.6-.6zm12.8 0h-.4a.6.6 0 0 0 0 1.2h.4a.6.6 0 0 0 0-1.2zM3.2 3.4 2.9 3A.6.6 0 0 0 2 4l.3.3a.6.6 0 1 0 .9-.8zm9.6 9.6.3.3a.6.6 0 0 0 .9-.9l-.3-.3a.6.6 0 1 0-.9.9zM3.2 12.6l-.3.3a.6.6 0 1 0 .9.9l.3-.4a.6.6 0 1 0-.9-.8zM12.8 3.4l.3-.4a.6.6 0 0 0-.9-.9l-.3.3a.6.6 0 1 0 .9 1z"/></svg>
      </button>
      <select id="lang-switch" class="lang-switch" aria-label="Language"></select>
    </div>

    <!-- URL save banner -->
    <div id="save-banner" class="save-banner hidden">
      <span class="save-banner-text" id="save-banner-text"></span>
      <button id="btn-banner-action" class="btn btn-primary btn-sm" type="button"></button>
    </div>

    <!-- Active filter chips -->
    <div id="chips" class="chips hidden"></div>

    <!-- Filter popover -->
    <div id="filter-popover" class="filter-popover hidden">
      <label><span data-i18n="filterStatus"></span><select id="filter-status"></select></label>
      <label><span data-i18n="filterTag"></span><select id="filter-tag"></select></label>
      <label><span data-i18n="filterLanguage"></span><select id="filter-language"></select></label>
      <label><span data-i18n="filterProject"></span><select id="filter-project"></select></label>
      <label><span data-i18n="filterArchived"></span><select id="filter-archived"></select></label>
      <button id="btn-clear-filters" class="btn btn-link" type="button" data-i18n="clearFilters"></button>
    </div>

    <!-- Content: list (compact) / list + detail (expanded) -->
    <div class="content">
      <section id="results-pane" class="results-pane">
        <div id="results-state" class="state-block hidden"></div>
        <ul id="results-list" class="results-list"></ul>
        <div id="results-more" class="results-more hidden"><button id="btn-more" class="btn btn-link" type="button">↓</button></div>
      </section>
      <section id="detail-pane" class="detail-pane hidden">
        <div id="detail-content" class="detail-content"></div>
      </section>
    </div>
    <div class="statusbar"><span id="results-count"></span><span class="statusbar-hint" data-i18n="statusbarHint"></span></div>
  </div>

  <!-- Import modal -->
  <dialog id="modal-import" class="modal">
    <form id="form-import" method="dialog">
      <h2 data-i18n="importTitle"></h2>
      <label class="field">
        <span data-i18n="importUsername"></span>
        <input id="import-username" type="text" autocomplete="off" spellcheck="false">
      </label>
      <label class="field field-inline">
        <input id="import-readme" type="checkbox" checked>
        <span data-i18n="importIncludeReadme"></span>
      </label>
      <div class="import-divider"><span data-i18n="orDivider"></span></div>
      <div class="field">
        <button type="button" id="btn-import-bookmarks" class="btn" data-i18n="importBookmarks"></button>
        <p class="hint" data-i18n="importBookmarksHelp"></p>
      </div>
      <div id="import-progress" class="hidden">
        <progress id="import-bar" max="1" value="0"></progress>
        <p id="import-status" class="form-message"></p>
        <ul id="import-failures" class="failure-list"></ul>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" data-close data-i18n="close"></button>
        <button type="button" id="btn-import-cancel" class="btn hidden" data-i18n="importCancel"></button>
        <button type="button" id="btn-import-resume" class="btn hidden" data-i18n="importResume"></button>
        <button type="submit" id="btn-import-start" class="btn btn-primary" data-i18n="importStart"></button>
      </div>
    </form>
  </dialog>

  <!-- Settings modal -->
  <dialog id="modal-settings" class="modal">
    <div>
      <h2 data-i18n="settingsTitle"></h2>
      <dl class="settings-list">
        <dt data-i18n="settingsVersion"></dt><dd id="settings-version"></dd>
        <dt data-i18n="settingsDataDir"></dt><dd id="settings-datadir" class="mono"></dd>
        <dt data-i18n="settingsPairing"></dt>
        <dd>
          <code id="settings-token" class="mono token-box"></code>
          <button id="btn-copy-token" class="btn btn-link" type="button" data-i18n="copy"></button>
          <p class="hint" data-i18n="settingsPairingHelp"></p>
        </dd>
        <dt data-i18n="settingsGithubToken"></dt>
        <dd>
          <p id="settings-gh-state" class="hint"></p>
          <div class="row">
            <input id="settings-gh-token" type="password" autocomplete="off">
            <button id="btn-save-gh-token" class="btn" type="button" data-i18n="settingsTokenSave"></button>
            <button id="btn-clear-gh-token" class="btn btn-link" type="button" data-i18n="settingsTokenClear"></button>
          </div>
          <p class="hint" data-i18n="settingsGithubTokenHelp"></p>
        </dd>
        <dt data-i18n="settingsDeepseekKey"></dt>
        <dd>
          <p id="settings-ds-state" class="hint"></p>
          <div class="row">
            <input id="settings-ds-key" type="password" autocomplete="off">
            <button id="btn-save-ds-key" class="btn" type="button" data-i18n="settingsTokenSave"></button>
            <button id="btn-clear-ds-key" class="btn btn-link" type="button" data-i18n="settingsTokenClear"></button>
          </div>
          <p class="hint" data-i18n="settingsDeepseekHelp"></p>
        </dd>
        <dt data-i18n="settingsExport"></dt>
        <dd><button id="btn-export" class="btn" type="button" data-i18n="settingsExport"></button></dd>
        <dt data-i18n="settingsRestore"></dt>
        <dd>
          <div class="row">
            <select id="restore-mode" class="select"></select>
            <button id="btn-restore" class="btn" type="button" data-i18n="restoreButton"></button>
            <input id="restore-file" type="file" accept="application/json,.json" class="hidden">
          </div>
          <p id="restore-result" class="hint"></p>
        </dd>
        <dt data-i18n="refreshAll"></dt>
        <dd>
          <button id="btn-refresh-all" class="btn" type="button" data-i18n="refreshAll"></button>
          <p id="refresh-all-state" class="hint"></p>
        </dd>
      </dl>
      <div class="modal-actions">
        <button type="button" class="btn" data-close data-i18n="close"></button>
      </div>
    </div>
  </dialog>

  <!-- Confirm dialog -->
  <dialog id="modal-confirm" class="modal modal-narrow">
    <div>
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button type="button" class="btn" data-close data-i18n="cancel"></button>
        <button type="button" id="btn-confirm" class="btn btn-danger" data-i18n="confirm"></button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
