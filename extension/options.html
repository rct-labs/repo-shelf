<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Repo Shelf Options</title>
  <style>
    body { font-family: "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; font-size: 14px; color: #1f2328; }
    h1 { font-size: 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 13px; }
    input, select { width: 100%; padding: 7px 9px; border: 1px solid #d1d9e0; border-radius: 6px; font: inherit; box-sizing: border-box; }
    .row { display: flex; gap: 8px; margin-top: 16px; }
    button { padding: 7px 14px; border: 1px solid #d1d9e0; border-radius: 6px; background: #fff; cursor: pointer; }
    .primary { background: #0969da; border-color: #0969da; color: #fff; }
    .msg { margin-top: 12px; font-size: 13px; }
    .msg.ok { color: #116329; }
    .msg.err { color: #cf222e; }
    .hint { font-size: 12px; color: #59636e; }
  </style>
</head>
<body>
  <h1>Repo Shelf — Options / 选项</h1>

  <label for="server-url">Server URL / 服务地址</label>
  <input id="server-url" type="text" spellcheck="false" placeholder="http://127.0.0.1:4790">

  <label for="pairing-token">Pairing token / 配对令牌</label>
  <input id="pairing-token" type="text" spellcheck="false">
  <p class="hint">Copy it from the app's Settings page. / 从应用的“设置”页复制。</p>

  <label for="lang">Language / 语言</label>
  <select id="lang">
    <option value="auto">Auto (browser) / 跟随浏览器</option>
    <option value="en">English</option>
    <option value="zh-CN">简体中文</option>
  </select>

  <div class="row">
    <button id="save" class="primary">Save / 保存</button>
    <button id="test">Test connection / 测试连接</button>
  </div>
  <p id="message" class="msg"></p>

  <script type="module" src="/options.js"></script>
</body>
</html>
